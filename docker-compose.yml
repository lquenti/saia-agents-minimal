version: '3.8'

services:
  coding-agent:
    build: .
    container_name: advanced-coding-agent
    hostname: coding-agent
    
    # Security: Run as non-root (already set in Dockerfile)
    user: "agent"
    
    # Isolated workspace - only this directory is writable
    volumes:
      # Read-only: Agent configuration
      - ./agents.json:/home/agent/.openclaw/agents.json:ro
      
      # Read-only: Tool definitions
      - ./tools.md:/home/agent/.openclaw/workspace/TOOLS.md:ro
      
      # Writable: Project workspace (this is where agent works)
      - ./projects:/home/agent/workspace/projects:rw
      
      # Read-only: Documentation
      - ./docs:/home/agent/workspace/docs:ro
      
      # Temporary workspace (cleared on restart)
      - agent-temp:/home/agent/workspace/temp:rw
    
    # Network isolation - no external access by default
    networks:
      - agent-network
    
    # Resource limits - prevent runaway processes
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    # Security: Drop all capabilities except essentials
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Remove in production!
    
    # Read-only root filesystem (except mounted volumes)
    read_only: true
    
    # Temporary filesystem for runtime needs
    tmpfs:
      - /tmp:size=100M,mode=1777
      - /var/run:size=10M,mode=755
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - WORKSPACE=/home/agent/workspace
      - ALLOWED_TOOLS=git,github,fileops,shell,web
      - BLOCKED_COMMANDS=rm -rf,dd,mkfs,fdisk,partition
      - MAX_FILE_SIZE=104857600  # 100MB
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes
volumes:
  agent-temp:
    driver: local

# Network isolation
networks:
  agent-network:
    driver: bridge
    internal: true  # No external internet access by default
