# GitLab CI/CD Pipeline for Advanced Coding Agent
# Renders documentation as HTML and deploys to GitLab Pages

image: python:3.11-slim

# Allow manual pipeline triggers from web UI
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

pages:
  stage: deploy
  script:
    # Generate HTML pages (pure Python, no dependencies)
    - python scripts/generate-pages.py
  artifacts:
    paths:
      - public
