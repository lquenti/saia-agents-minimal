# GitLab CI/CD Pipeline for Advanced Coding Agent
# Renders documentation as HTML and deploys to GitLab Pages

image: node:20-bookworm

# Allow manual pipeline triggers from web UI
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'  # Manual trigger
    - if: $CI_PIPELINE_SOURCE == 'schedule'  # Scheduled trigger
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Push to main
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'  # Merge request

pages:
  stage: deploy
  script:
    # Install markdown-to-html converter
    - npm install -g markdown-it

    # Create public directory for GitLab Pages
    - mkdir -p public

    # Copy README.md to public/index.html (converted)
    - node -e "
        const fs = require('fs');
        const MarkdownIt = require('markdown-it');
        const md = new MarkdownIt({ html: true, linkify: true, typographer: true });
        
        // Convert README.md to index.html
        const readme = fs.readFileSync('README.md', 'utf8');
        const html = md.render(readme);
        const fullHtml = \`
<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\">
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
  <title>Advanced Coding Agent</title>
  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css\">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }
    body {
      background-color: #f6f8fa;
    }
    nav {
      background: #24292e;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    nav a {
      color: #fff;
      margin-right: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href=\"/\">README</a>
    <a href=\"/CONFIGURATION.html\">Configuration</a>
    <a href=\"/SKILLS.html\">Skills</a>
    <a href=\"/SECURITY.html\">Security</a>
    <a href=\"/SOFTWARE_ENGINEERING_WORKFLOW.html\">Workflow</a>
    <a href=\"/QUICK_START_SKILLS.html\">Quick Start</a>
  </nav>
  <div class=\"markdown-body\">
    \${html}
  </div>
</body>
</html>
\`;
        fs.writeFileSync('public/index.html', fullHtml);
      "

    # Convert docs/*.md to HTML
    - node -e "
        const fs = require('fs');
        const path = require('path');
        const MarkdownIt = require('markdown-it');
        const md = new MarkdownIt({ html: true, linkify: true, typographer: true });
        
        const docsDir = 'docs';
        const files = fs.readdirSync(docsDir);
        
        files.forEach(file => {
          if (file.endsWith('.md')) {
            const markdown = fs.readFileSync(path.join(docsDir, file), 'utf8');
            const html = md.render(markdown);
            const htmlFile = file.replace('.md', '.html');
            
            const fullHtml = \`
<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\">
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
  <title>\${file.replace('.md', '').replace(/-/g, ' ').toUpperCase()}</title>
  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css\">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }
    body {
      background-color: #f6f8fa;
    }
    nav {
      background: #24292e;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    nav a {
      color: #fff;
      margin-right: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href=\"/\">README</a>
    <a href=\"/CONFIGURATION.html\">Configuration</a>
    <a href=\"/SKILLS.html\">Skills</a>
    <a href=\"/SECURITY.html\">Security</a>
    <a href=\"/SOFTWARE_ENGINEERING_WORKFLOW.html\">Workflow</a>
    <a href=\"/QUICK_START_SKILLS.html\">Quick Start</a>
  </nav>
  <div class=\"markdown-body\">
    \${html}
  </div>
</body>
</html>
\`;
            fs.writeFileSync(path.join('public', htmlFile), fullHtml);
            console.log('Converted:', file, '->', htmlFile);
          }
        });
      "

    # Copy assets if any
    - cp -r assets public/ 2>/dev/null || true

  artifacts:
    paths:
      - public
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'web'  # Manual trigger
    - if: $CI_PIPELINE_SOURCE == 'schedule'  # Scheduled trigger

# Optional: Lint markdown files (MR only or manual)
lint:
  stage: test
  script:
    - echo "Checking markdown syntax..."
    - find . -name "*.md" -type f | head -10 | while read file; do
        echo "Checking: $file";
      done
    - echo "Markdown linting passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web' && $MANUAL_LINT == "true"  # Manual with variable

# Optional: Build test (MR only or manual)
build:
  stage: build
  script:
    - echo "Building documentation..."
    - npm install -g markdown-it
    - mkdir -p test-public
    - node -e "
        const fs = require('fs');
        const MarkdownIt = require('markdown-it');
        const md = new MarkdownIt();
        const readme = fs.readFileSync('README.md', 'utf8');
        const html = md.render(readme);
        fs.writeFileSync('test-public/index.html', html);
      "
    - test -f test-public/index.html && echo "Build successful"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web' && $MANUAL_BUILD == "true"  # Manual with variable

# Manual trigger jobs (click to run from CI/CD → Pipelines → Run pipeline)
manual_lint:
  stage: test
  script:
    - echo "=== MANUAL LINT TRIGGERED ==="
    - echo "Checking markdown syntax..."
    - find . -name "*.md" -type f | while read file; do
        echo "✓ Checking: $file";
      done
    - echo "✅ Markdown linting passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'  # Manual trigger only
  when: manual
  allow_failure: true

manual_build:
  stage: build
  script:
    - echo "=== MANUAL BUILD TRIGGERED ==="
    - echo "Building documentation..."
    - npm install -g markdown-it
    - mkdir -p test-manual
    - node scripts/convert-to-html.js
    - test -d test-manual && echo "✅ Build successful"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'  # Manual trigger only
  when: manual
  allow_failure: true

manual_pages_deploy:
  stage: deploy
  script:
    - echo "=== MANUAL PAGES DEPLOY TRIGGERED ==="
    - npm install -g markdown-it
    - mkdir -p public
    - node scripts/convert-to-html.js
    - echo "✅ Pages built successfully"
    - echo "Deploying to GitLab Pages..."
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'  # Manual trigger only
  when: manual
  allow_failure: false
